services:
  backend:
    build: .
    environment:
      PORT: ${PORT} 
      DATABASE_URL: ${DATABASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - ./src:/app/src
    depends_on:
      - postgres
      - neo4j

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"

  neo4j:
    image: neo4j:5
    container_name: proyecto-backend-neo4j-1
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*,gds.*
    ports:
      - "7474:7474" # Browser UI
      - "7687:7687" # Bolt Protocol
    volumes:
      - neo4j_data:/data
      - ./database/neo4j:/var/lib/neo4j/import
    # Script para auto-ejecutar las constraints e índices
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER} -p ${NEO4J_PASSWORD} 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
    entrypoint: >
      /bin/bash -c "
      (sleep 20 && cypher-shell -u ${NEO4J_USER} -p ${NEO4J_PASSWORD} -f /var/lib/neo4j/import/init.cypher && echo '✅ Neo4j inicializado') &
      /startup/docker-entrypoint.sh neo4j"

  flyway:
    image: flyway/flyway
    command: -connectRetries=60 migrate
    volumes:
      - ./database/migrations:/flyway/sql
    environment:
      FLYWAY_URL: ${FLYWAY_URL}
      FLYWAY_USER: ${DB_USER}
      FLYWAY_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - postgres

volumes:
  neo4j_data: